[build-system]
requires = ["setuptools==68.1.2"]
build-backend = "setuptools.build_meta"

[project]
name = "football-prediction-lab"
version = "0.1.0"
description = "Auditable, time-aware football prediction research lab"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Manus AI" }]
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "scipy>=1.11,<2",
  "aiohttp>=3.14,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
football-lab = "football_prediction_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
