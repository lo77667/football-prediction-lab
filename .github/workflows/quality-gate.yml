name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test-and-lint:
    name: Test and lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Runner preflight
        shell: bash
        run: |
          set -euxo pipefail
          printf 'runner=%s\n' "$RUNNER_NAME"
          printf 'os=%s\n' "$RUNNER_OS"
          printf 'arch=%s\n' "$RUNNER_ARCH"
          python --version
          python -m pip --version
          git --version
          git status --short --branch

      - name: Install project and development dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir ".[dev]"
          python -m pip check

      - name: Compile Python sources
        shell: bash
        run: |
          set -euxo pipefail
          python -m compileall -q src scripts_*.py

      - name: Run tests
        shell: bash
        run: |
          set -euxo pipefail
          python -m pytest -q

      - name: Run lint
        shell: bash
        run: |
          set -euxo pipefail
          python -m ruff check .

      - name: Check repository whitespace
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check

      - name: Debug mode after silent failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo '--- DEBUG MODE: a previous step failed ---'
          date -u
          pwd
          df -h
          free -h
          git status --short --branch
          git log -3 --oneline --decorate
          python --version
          python -m pip --version
          python -m pip list --format=columns
          echo '--- environment (sensitive values redacted) ---'
          env | sort | sed -E 's/^(.*(TOKEN|KEY|SECRET|PASSWORD|PASS|CREDENTIAL)[^=]*)=.*/\1=[REDACTED]/I'
          echo '--- repository files ---'
          find . -maxdepth 3 -type f -not -path './.git/*' | sort | sed -n '1,240p'
