name: quality-gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test-and-lint:
    name: Test and lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Show execution context
        shell: bash
        run: |
          set -euxo pipefail
          printf 'runner=%s\n' "$RUNNER_NAME"
          printf 'event=%s\n' "$GITHUB_EVENT_NAME"
          printf 'ref=%s\n' "$GITHUB_REF"
          printf 'sha=%s\n' "$GITHUB_SHA"
          python --version
          python -m pip --version
          git status --short --branch

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'
          python -m pip check

      - name: Verify project import path
        shell: bash
        run: |
          set -euxo pipefail
          python -c "import football_prediction_lab; print(football_prediction_lab.__file__)"
          python -c "import football_prediction_lab.evaluation.cycle36_model_selection as m; print(m.__file__)"

      - name: Run pytest
        shell: bash
        run: |
          set -euxo pipefail
          python -m pytest -q

      - name: Run Ruff
        shell: bash
        run: |
          set -euxo pipefail
          ruff check .

      - name: Compile Python sources
        shell: bash
        run: |
          set -euxo pipefail
          python -m compileall -q src scripts
          python -m compileall -q src scripts_*.py

      - name: Check repository whitespace
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
