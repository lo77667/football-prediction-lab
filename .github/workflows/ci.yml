name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Runner preflight
        run: |
          set -eux
          python --version
          python -m pip --version
          git status --short --branch
      - name: Install project
        run: python -m pip install --upgrade pip && pip install ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run lint
        run: ruff check .
      - name: Compile Python sources
        run: python -m compileall -q src scripts_*.py
